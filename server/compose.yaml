# docker compose와 podman-compose 모두에서 동작합니다.
# 시크릿은 파일 드라이버만 씁니다 (스웜 전용 기능 미사용).
#
#   export KIWOOM_TOKEN=$(kiwoom auth login ...)        # 호스트에서 발급
#   mkdir -p secrets && openssl rand -hex 32 > secrets/mcp_token.txt
#   docker compose up -d     (또는 podman-compose up -d)

services:
  kiwoom-mcp:
    build: .
    restart: unless-stopped

    # 127.0.0.1에 묶어 호스트 밖으로 나가지 않게 합니다. 컨테이너 안에서는
    # 0.0.0.0에 바인드하므로 서버가 인증 토큰을 요구합니다.
    ports:
      - "127.0.0.1:8765:8765"

    environment:
      KIWOOM_DOMAIN: mock          # prod = 실계좌. 바꾸기 전에 충분히 검증하세요
      # 컨테이너는 키체인이 없으므로 호스트에서 발급한 토큰을 주입합니다.
      # 토큰은 만료되므로 오래 돌리려면 주기적으로 재발급해 넣어야 합니다.
      KIWOOM_TOKEN: ${KIWOOM_TOKEN:?호스트에서 KIWOOM_TOKEN을 export 하세요}
      KIWOOM_MCP_AUTH_TOKEN_FILE: /run/secrets/kiwoom_mcp_token
      # 주문을 허용하려면 주석을 해제하고, 아래 볼륨을 반드시 유지하세요.
      # KIWOOM_MCP_ALLOW_ORDERS: "1"

    secrets:
      - kiwoom_mcp_token

    # 주문을 켰다면 이 볼륨은 필수입니다. 멱등성 원장(~/.kiwoom/idempotency)이
    # 여기 쌓이는데, 재시작으로 사라지면 기록된 주문 키가 보이지 않게 되어
    # 재시도가 같은 주문을 다시 전송할 수 있습니다.
    volumes:
      - kiwoom-state:/home/kiwoom/.kiwoom

secrets:
  kiwoom_mcp_token:
    file: ./secrets/mcp_token.txt

volumes:
  kiwoom-state:
