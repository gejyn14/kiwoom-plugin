[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom-mcp"
dynamic = ["version"]
description = "MCP server for kiwoom-cli — 키움증권 REST API 236종을 AI 에이전트에 연결합니다"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yu Jin" }]
keywords = ["mcp", "model-context-protocol", "kiwoom", "trading", "stock", "korea"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "kiwoom-cli>=2.14.0",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
kiwoom-mcp = "kiwoom_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/gejyn14/kiwoom-plugin"
Repository = "https://github.com/gejyn14/kiwoom-plugin"
Issues = "https://github.com/gejyn14/kiwoom-plugin/issues"
"kiwoom-cli" = "https://github.com/gejyn14/kiwoom-cli"

[tool.setuptools.dynamic]
version = { attr = "kiwoom_mcp.__version__" }

[tool.setuptools.packages.find]
include = ["kiwoom_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
